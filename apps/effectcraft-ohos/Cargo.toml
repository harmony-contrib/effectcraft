[package]
name = "effectcraft-ohos"
description = "OpenHarmony EntryAbility registration for EffectCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

# Only the Ability macro's N-API registration may relax this lint. The host and
# every engine crate retain the workspace's unsafe_code = "forbid" policy.
[lints.rust]
unsafe_code = "deny"

[features]
default = []
ohos-control = ["effectcraft/ohos-control"]

[target.'cfg(target_env = "ohos")'.dependencies]
effectcraft = { path = "../effectcraft" }
log.workspace = true
openharmony-ability = "1.0.0-beta.5"
openharmony-ability-derive = "1.0.0-beta.5"
napi-ohos = "1.2"
napi-derive-ohos = "1.2"
ohos-hilog-binding = { version = "0.2.3", features = ["log"] }

[build-dependencies]
napi-build-ohos = "1.2"
