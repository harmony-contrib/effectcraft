[package]
name = "effectcraft"
description = "EffectCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "effectcraft"

[lints]
workspace = true

[features]
default = []
ohos-control = []

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-host = { workspace = true }
effectcraft-ui-egui = { workspace = true }
egui = { workspace = true }
# Help and community links open through the host's system browser integration.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "links"] }
serde = { workspace = true }
serde_json = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_env = "ohos"))'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
# The desktop window's monitors, geometry and event-loop options, on eframe's winit.
winit = { version = "0.30", default-features = false }
rfd = { workspace = true }
cpal = { workspace = true }

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
# Native GNOME/Wayland controls without a bundled title font.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita-notitle"] }

# Settings ▸ Appearance ▸ Sync with System: the XDG desktop portal's colour scheme. Already in
# Cargo.lock (accesskit, through eframe), so it adds no new crates.
zbus = "5.19"

[target.'cfg(target_env = "ohos")'.dependencies]
eframe = { workspace = true, features = ["persistence"] }
openharmony-ability = "1.0.0-beta.5"
ohos-hilog-binding = { version = "0.2.3", features = ["log"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "extended-plugins"] }
chrono = { workspace = true }
craft-font-catalog = { git = "https://github.com/storytold/craft-libs", rev = "c5a1cbfb5f9049f9270955caffb5bee5997aebf7", version = "=0.1.0", default-features = false }

[build-dependencies]
# Icon + VERSIONINFO for effectcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Keep the control channel responsive when the window is covered (App Nap / occlusion throttling).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }
# The native menu bar (NSMenu). MIT OR Apache-2.0; macOS only, never in the web build.
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
# NSApplication hide / hide others / show all, and the pasteboard for Edit ▸ Paste in text fields.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSPasteboard"] }
# Finder double-click, Open With, Dock drops and `open -a EffectCraft x.ecproj` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used by
# PhotoCraft and PdfCraft) registers the handler (Objective-C interop needs unsafe, which our
# workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"

[target.'cfg(windows)'.dependencies]
craft-update = { workspace = true }
